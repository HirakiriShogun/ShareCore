name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 195.133.5.249
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/rent_device
            git pull
            pm2 restart 0
