{% extends "admin/layout.html" %}
{% block title %}Список администраторов{% endblock %}
{% block admin_content %}
<header class="view-header">
    <div>
        <p class="eyebrow">Команда</p>
        <h1>Администраторы</h1>
    </div>
    <div class="view-header__actions">
        <a class="btn btn-primary" href="{{ url_for('admin.users_new_page') }}">+ Новый пользователь</a>
    </div>
</header>

<section class="filters-card admin-card searchbar">
    <div class="filter-row">
        <div class="field">
            <label class="field__label" for="search">Email</label>
            <input id="search" type="search" class="field__input search-input" placeholder="Введите email" autocomplete="off">
        </div>
        <div class="chips role-chips" id="role-chips" role="tablist" aria-label="Роль">
            <button class="chip is-active" data-role="all">Все</button>
            <button class="chip chip-sa" data-role="superadmin">Superadmin</button>
            <button class="chip chip-la" data-role="localadmin">Localadmin</button>
            <button class="chip chip-worker" data-role="worker">Worker</button>
        </div>
    </div>
</section>

<section id="users-list" class="grid user-grid"></section>
{% endblock %}
{% block admin_scripts %}
<script defer src="{{ url_for('static', filename='admin/users_list.js') }}"></script>
{% endblock %}
