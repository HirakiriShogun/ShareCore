{% extends "admin/layout.html" %}
{% block title %}Новый администратор{% endblock %}
{% block admin_content %}
<header class="view-header">
    <div>
        <p class="eyebrow">Создание пользователя</p>
        <h1>Новый администратор</h1>
    </div>
    <div class="view-header__actions">
        <a class="btn btn-outline" href="{{ url_for('admin.users_page') }}">← Список</a>
    </div>
</header>

<section class="form-grid">
    <article class="admin-card form-card">
        <h3 class="section-title">Данные учётной записи</h3>
        <div class="field">
            <label class="field__label" for="u-email">Email</label>
            <input class="field__input" id="u-email" placeholder="email@example.com" autocomplete="off">
        </div>
        <div class="field with-icon">
            <label class="field__label" for="u-pass">Временный пароль</label>
            <input class="field__input" id="u-pass" type="password" placeholder="********" autocomplete="new-password">
            <button class="eye-toggle" type="button" aria-label="Показать пароль" id="u-eye">👁</button>
        </div>
    </article>

    <article class="admin-card form-card">
        <h3 class="section-title">Роль</h3>
        <div class="field">
            <label class="field__label" for="u-role">Уровень доступа</label>
            <select class="field__select" id="u-role">
                <option value="localadmin">localadmin — доступ к своим устройствам</option>
                <option value="superadmin">superadmin — полный доступ</option>
            </select>
        </div>
    </article>

    <article class="admin-card form-card">
        <h3 class="section-title">Сохранение</h3>
        <div class="form-actions">
            <a class="link-cancel" href="{{ url_for('admin.dashboard') }}">Отмена</a>
            <button class="btn btn-primary" id="u-add">Создать</button>
        </div>
        <div id="msg" class="field__label form-message"></div>
    </article>
</section>
{% endblock %}
{% block admin_scripts %}
<script defer src="{{ url_for('static', filename='admin/users_add.js') }}"></script>
{% endblock %}
