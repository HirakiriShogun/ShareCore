{% extends "admin/layout.html" %}
{% block title %}Добавить пользователя{% endblock %}
{% block admin_content %}
<div class="admin-toolbar">
  <a class="btn small" href="{{ url_for('admin.dashboard') }}">Назад</a>
</div>
<h2 class="section-title">Новый пользователь</h2>
<div class="grid cols-2">
  <section class="admin-card form-card">
    <div class="field">
      <label class="field__label" for="u-email">Email</label>
      <input class="field__input" id="u-email" placeholder="Введите email" autocomplete="off">
    </div>
    <div class="field with-icon">
      <label class="field__label" for="u-pass">Пароль</label>
      <input class="field__input" id="u-pass" type="password" placeholder="Введите пароль" autocomplete="new-password">
      <button class="eye-toggle" type="button" aria-label="Показать пароль" title="Показать/скрыть"
        id="u-eye">👁</button>
    </div>
  </section>

  <section class="admin-card form-card">
    <div class="field">
      <label class="field__label" for="u-role">Роль</label>
      <select class="field__select" id="u-role">
        <option value="localadmin">localadmin</option>
        <option value="superadmin">superadmin</option>
      </select>
    </div>
    <div class="field__label" style="margin-top:6px;">
      Подсказки: localadmin — владелец точки; superadmin — полный доступ;
    </div>
  </section>

  <section class="admin-card form-card">
    <div class="grid" style="grid-template-columns: auto auto; justify-content:flex-end; align-items:center; gap:12px;">
      <a class="link-cancel" href="{{ url_for('admin.dashboard') }}">Отмена</a>
      <button class="btn small" id="u-add">Создать</button>
    </div>
    <div id="msg" class="field__label" style="margin-top:8px;"></div>
  </section>
</div>
{% endblock %}
{% block admin_scripts %}
<script defer src="{{ url_for('static', filename='admin/users_add.js') }}"></script>
{% endblock %}
