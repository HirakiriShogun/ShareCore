{% extends "base.html" %}
{% block title %}Результат оплаты{% endblock %}
{% block content %}
<link rel="preload" as="style" href="{{ url_for('static', filename='device/styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='device/styles.css') }}">

<div class="device-page" role="main">
    <div class="device-bg" aria-hidden="true">
        <div class="bg-blob bg-blob-a"></div>
        <div class="bg-blob bg-blob-b"></div>
        <div class="liquid-overlay"></div>
        <div class="glass-caustics"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="device-container">
        <div class="device-card">
            <div class="payment-result-content">
                {% if success %}
                <div class="result-icon result-icon-success">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h1 class="result-title result-title-success">Успешно!</h1>
                {% else %}
                <div class="result-icon result-icon-error">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h1 class="result-title result-title-error">Ошибка оплаты</h1>
                {% endif %}

                <p class="result-message">{{ message }}</p>

                {% if device_uid %}
                <a href="{{ url_for('public.public_device', uid=device_uid) }}" class="btn-pay">
                    Вернуться к устройству
                </a>
                {% else %}
                <button onclick="window.close()" class="btn-pay">
                    Закрыть
                </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<style>
    .payment-result-content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 20px;
    }

    .result-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .result-icon-success {
        background: linear-gradient(135deg, rgba(34, 197, 94, .2), rgba(34, 197, 94, .1));
        border: 2px solid rgba(34, 197, 94, .4);
        color: #86efac;
    }

    .result-icon-error {
        background: linear-gradient(135deg, rgba(239, 68, 68, .2), rgba(239, 68, 68, .1));
        border: 2px solid rgba(239, 68, 68, .4);
        color: #fecaca;
    }

    .result-title {
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 16px;
        letter-spacing: .2px;
    }

    .result-title-success {
        background: linear-gradient(90deg, #86efac, #22c55e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .result-title-error {
        background: linear-gradient(90deg, #fecaca, #ef4444);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .result-message {
        color: var(--text);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .btn-pay {
        display: inline-block;
        text-decoration: none;
    }
</style>

<script defer src="{{ url_for('static', filename='device/app.js') }}"></script>
{% endblock %}
